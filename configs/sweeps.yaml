program: src/main.py
method: bayes
metric:
    name: val_arcface_loss
    goal: minimize
parameters:
    Encoder.arcface_margin:
        min: 0.1
        max: 0.6
    Encoder.arcface_scale:
        values: [16, 32, 64, 128]

command:
    - ${env}
    - python
    - ${program}
    - --multirun # allows hydra to accept multiple runs for sweeps
